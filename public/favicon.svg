<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Screen Display Gradient (Fondo de pantalla) -->
    <radialGradient id="screenDisplayBg" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="55%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#021526"/>
    </radialGradient>

    <!-- Sleek Space Silver / Titanium Gradients -->
    <linearGradient id="silverLid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#f1f5f9"/>
      <stop offset="70%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <linearGradient id="silverBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <linearGradient id="silverBase" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#f1f5f9"/>
      <stop offset="85%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <linearGradient id="notchGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="35%" stop-color="#e2e8f0"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <!-- Glass Specular Diagonal Sheen Across Screen -->
    <linearGradient id="glassSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="65%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Drop Shadows for the Laptop Body -->
    <filter id="laptopShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#0284c7" flood-opacity="0.35"/>
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Laptop Scaled to Horizontal Edges and Shifted Down Vertically -->
  <g transform="translate(256, 306) scale(1.14) translate(-256, -291)">
    <!-- ======================================================== -->
    <!-- 1. LAPTOP SCREEN LID (CON EL FONDO DE PANTALLA)          -->
    <!-- ======================================================== -->
    <g filter="url(#laptopShadow)">
      <!-- Metallic Space Silver Bezel Frame -->
      <rect x="76" y="146" width="360" height="244" rx="22" fill="url(#silverLid)" stroke="url(#silverBorder)" stroke-width="3"/>

      <!-- Inner Screen Bezel Border -->
      <rect x="88" y="158" width="336" height="220" rx="14" fill="#0f172a"/>

      <!-- Screen Glass Display Area (Fondo de pantalla) -->
      <rect x="94" y="164" width="324" height="208" rx="10" fill="url(#screenDisplayBg)"/>

      <!-- Glass Specular Reflection Sheen -->
      <path d="M 94 164 L 270 164 L 94 335 Z" fill="url(#glassSheen)"/>

      <!-- Webcam Top Dot -->
      <circle cx="256" cy="153" r="2.5" fill="#64748b"/>
      <circle cx="256" cy="153" r="1" fill="#38bdf8"/>
    </g>

    <!-- ======================================================== -->
    <!-- 2. LAPTOP BASE (CHASSIS)                                 -->
    <!-- ======================================================== -->
    <g>
      <!-- Base Plate Top and Hinge -->
      <path d="
        M 32 390
        C 32 387 35 384 38 384
        L 474 384
        C 477 384 480 387 480 390
        L 454 426
        C 450 432 443 436 436 436
        L 76 436
        C 69 436 62 432 58 426
        Z
      " fill="url(#silverBase)" stroke="url(#silverBorder)" stroke-width="2.5"/>

      <!-- Apple-style Front Notch / Opening Groove -->
      <path d="M 214 384 L 298 384 C 298 390 293 394 286 394 L 226 394 C 219 394 214 390 214 384 Z" fill="url(#notchGradient)"/>

      <!-- Front Edge Specular Light Reflection -->
      <line x1="76" y1="435" x2="436" y2="435" stroke="#ffffff" stroke-width="2.5" stroke-opacity="0.95"/>

      <!-- Soft Cyan Ground Shadow Under Base -->
      <ellipse cx="256" cy="446" rx="195" ry="14" fill="#0284c7" fill-opacity="0.3" filter="blur(6px)"/>
    </g>
  </g>
</svg>
