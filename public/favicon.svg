<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background / Ambient Glows -->
    <radialGradient id="laptopAmbientGlow" cx="50%" cy="55%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.38"/>
      <stop offset="60%" stop-color="#818cf8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="screenDisplayBg" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="55%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#021526"/>
    </radialGradient>

    <!-- Sleek Apple Space Silver / Titanium Gradients (Lighter Metallic Body) -->
    <linearGradient id="silverLid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#f1f5f9"/>
      <stop offset="70%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <linearGradient id="silverBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <linearGradient id="silverBase" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#f1f5f9"/>
      <stop offset="85%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <linearGradient id="notchGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="35%" stop-color="#e2e8f0"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <!-- Glass Specular Diagonal Sheen Across Screen -->
    <linearGradient id="glassSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="65%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- The Vibrant Glowing "T" Gradients -->
    <linearGradient id="vibrantT" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="35%" stop-color="#60a5fa"/>
      <stop offset="70%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="tGloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Drop Shadows & Glow -->
    <filter id="laptopShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#0284c7" flood-opacity="0.35"/>
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <filter id="tNeonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Bloom Behind Laptop (Shifted Down) -->
  <ellipse cx="256" cy="306" rx="230" ry="170" fill="url(#laptopAmbientGlow)"/>

  <!-- ======================================================== -->
  <!-- 1. LAPTOP SCREEN LID (SHIFTED DOWN FOR OPTICAL BALANCE)  -->
  <!-- ======================================================== -->
  <g filter="url(#laptopShadow)">
    <!-- Metallic Space Silver Bezel Frame -->
    <rect x="76" y="146" width="360" height="244" rx="22" fill="url(#silverLid)" stroke="url(#silverBorder)" stroke-width="3"/>

    <!-- Inner Screen Bezel Border -->
    <rect x="88" y="158" width="336" height="220" rx="14" fill="#0f172a"/>

    <!-- Screen Glass Display Area -->
    <rect x="94" y="164" width="324" height="208" rx="10" fill="url(#screenDisplayBg)"/>

    <!-- Ambient Blue Energy Core Inside Display -->
    <ellipse cx="256" cy="268" rx="120" ry="75" fill="#38bdf8" fill-opacity="0.3"/>

    <!-- Glass Specular Reflection Sheen -->
    <path d="M 94 164 L 270 164 L 94 335 Z" fill="url(#glassSheen)"/>

    <!-- Webcam Top Dot -->
    <circle cx="256" cy="153" r="2.5" fill="#64748b"/>
    <circle cx="256" cy="153" r="1" fill="#38bdf8"/>

    <!-- ======================================================== -->
    <!-- 2. THE GLOWING "T" IN THE CENTER OF SCREEN               -->
    <!-- ======================================================== -->
    <g filter="url(#tNeonGlow)">
      <!-- Stylized Modern "T" Shape -->
      <path d="
        M 174 212
        C 174 204 180 198 188 198
        L 324 198
        C 332 198 338 204 338 212
        L 338 240
        C 338 248 332 254 324 254
        L 282 254
        L 282 322
        C 282 331 275 338 266 338
        L 246 338
        C 237 338 230 331 230 322
        L 230 254
        L 188 254
        C 180 254 174 248 174 240
        Z
      " fill="url(#vibrantT)"/>

      <!-- Specular Bevel Gloss on "T" Top -->
      <path d="
        M 188 200
        L 324 200
        C 330 200 336 204 336 210
        L 336 216
        C 310 209 282 207 256 207
        C 230 207 202 209 176 216
        L 176 210
        C 176 204 182 200 188 200
        Z
      " fill="url(#tGloss)"/>

      <!-- Center Tech Spark / Pulse -->
      <circle cx="256" cy="226" r="7.5" fill="#ffffff" filter="drop-shadow(0 0 6px #38bdf8)"/>
      <circle cx="256" cy="226" r="3.5" fill="#38bdf8"/>
    </g>
  </g>

  <!-- ======================================================== -->
  <!-- 3. LAPTOP BASE (ALIGNED WITH TAB BASELINE)              -->
  <!-- ======================================================== -->
  <g>
    <!-- Base Plate Top and Hinge -->
    <path d="
      M 32 390
      C 32 387 35 384 38 384
      L 474 384
      C 477 384 480 387 480 390
      L 454 426
      C 450 432 443 436 436 436
      L 76 436
      C 69 436 62 432 58 426
      Z
    " fill="url(#silverBase)" stroke="url(#silverBorder)" stroke-width="2.5"/>

    <!-- Apple-style Front Notch / Opening Groove -->
    <path d="M 214 384 L 298 384 C 298 390 293 394 286 394 L 226 394 C 219 394 214 390 214 384 Z" fill="url(#notchGradient)"/>

    <!-- Front Edge Specular Light Reflection -->
    <line x1="76" y1="435" x2="436" y2="435" stroke="#ffffff" stroke-width="2.5" stroke-opacity="0.95"/>

    <!-- Soft Cyan Ground Shadow Under Base -->
    <ellipse cx="256" cy="446" rx="195" ry="14" fill="#0284c7" fill-opacity="0.3" filter="blur(6px)"/>
  </g>
</svg>
