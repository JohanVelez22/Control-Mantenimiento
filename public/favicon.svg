<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Shield Glow -->
    <radialGradient id="shieldBg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#0f274a"/>
      <stop offset="60%" stop-color="#071324"/>
      <stop offset="100%" stop-color="#030810"/>
    </radialGradient>

    <!-- Shield Border Gradient -->
    <linearGradient id="shieldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="40%" stop-color="#2563eb"/>
      <stop offset="70%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <!-- Facet Gradients for Wolf Silhouette -->
    <linearGradient id="facetEarLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="facetEarRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <linearGradient id="facetEarInnerLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="facetEarInnerRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="facetForeheadLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="facetForeheadRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <linearGradient id="facetForeheadCenter" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <linearGradient id="facetCheekOuterLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="facetCheekOuterRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>

    <linearGradient id="facetCheekInnerLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="facetCheekInnerRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#0a0f1d"/>
    </linearGradient>

    <linearGradient id="facetNoseBridge" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="facetMuzzleLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="facetMuzzleRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e40af"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <linearGradient id="facetSnoutCenter" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="facetChin" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <!-- Glowing Cyber Eyes Gradient -->
    <linearGradient id="eyeGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#a5f3fc"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="wolfGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#06b6d4" flood-opacity="0.45"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <filter id="eyeNeon" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#22d3ee" flood-opacity="0.9"/>
    </filter>
  </defs>

  <!-- ================= SHIELD BADGE CONTAINER ================= -->
  <path d="M 256,16 
           L 446,78 
           L 446,268 
           C 446,380 366,458 256,496 
           C 146,458 66,380 66,268 
           L 66,78 Z"
        fill="url(#shieldBg)"
        stroke="url(#shieldBorder)"
        stroke-width="7"
        stroke-linejoin="round"
        filter="url(#wolfGlow)"/>

  <!-- Subtle Inner Shield Accent Rim -->
  <path d="M 256,32 
           L 430,88 
           L 430,264 
           C 430,366 356,440 256,476 
           C 156,440 82,366 82,264 
           L 82,88 Z"
        fill="none"
        stroke="#38bdf8"
        stroke-width="1.5"
        stroke-opacity="0.3"/>

  <!-- ================= GEOMETRIC WOLF HEAD ================= -->
  <g id="wolfHead">
    <!-- LEFT EAR -->
    <!-- Outer Ear Left -->
    <polygon points="256,128 172,48 152,168" fill="url(#facetEarLeft)"/>
    <!-- Inner Ear Cavity Left -->
    <polygon points="172,48 214,136 152,168" fill="url(#facetEarInnerLeft)"/>

    <!-- RIGHT EAR -->
    <!-- Outer Ear Right -->
    <polygon points="256,128 340,48 360,168" fill="url(#facetEarRight)"/>
    <!-- Inner Ear Cavity Right -->
    <polygon points="340,48 298,136 360,168" fill="url(#facetEarInnerRight)"/>

    <!-- FOREHEAD & CROWN -->
    <!-- Top Crown Left -->
    <polygon points="256,128 214,136 256,186" fill="url(#facetForeheadLeft)"/>
    <!-- Top Crown Right -->
    <polygon points="256,128 298,136 256,186" fill="url(#facetForeheadRight)"/>
    <!-- Center Forehead Diamond -->
    <polygon points="256,186 216,218 256,248 296,218" fill="url(#facetForeheadCenter)"/>
    <!-- Mid Forehead Left Wing -->
    <polygon points="214,136 152,168 216,218" fill="url(#facetEarInnerLeft)"/>
    <!-- Mid Forehead Right Wing -->
    <polygon points="298,136 360,168 296,218" fill="url(#facetEarInnerRight)"/>

    <!-- TEMPLE & UPPER CHEEKS -->
    <!-- Upper Cheek Left -->
    <polygon points="152,168 120,236 216,218" fill="url(#facetCheekOuterLeft)"/>
    <!-- Upper Cheek Right -->
    <polygon points="360,168 392,236 296,218" fill="url(#facetCheekOuterRight)"/>

    <!-- EYE SOCKETS / BROW RIDGES -->
    <!-- Brow Plate Left -->
    <polygon points="216,218 178,252 232,254" fill="#0369a1"/>
    <!-- Brow Plate Right -->
    <polygon points="296,218 334,252 280,254" fill="#075985"/>

    <!-- CHEEK RUFFS (LOWER FLARE) -->
    <!-- Outer Ruff Left -->
    <polygon points="120,236 96,306 178,284" fill="url(#facetCheekOuterLeft)"/>
    <!-- Mid Ruff Left -->
    <polygon points="120,236 178,252 178,284" fill="url(#facetCheekInnerLeft)"/>
    <!-- Outer Ruff Right -->
    <polygon points="392,236 416,306 334,284" fill="url(#facetCheekOuterRight)"/>
    <!-- Mid Ruff Right -->
    <polygon points="392,236 334,252 334,284" fill="url(#facetCheekInnerRight)"/>

    <!-- LOWER JAW ANGLE -->
    <!-- Lower Jaw Outer Left -->
    <polygon points="96,306 168,368 196,318" fill="#0c4a6e"/>
    <polygon points="96,306 196,318 178,284" fill="#075985"/>
    <!-- Lower Jaw Outer Right -->
    <polygon points="416,306 344,368 316,318" fill="#082f49"/>
    <polygon points="416,306 316,318 334,284" fill="#0369a1"/>

    <!-- NOSE BRIDGE -->
    <polygon points="256,248 232,254 242,328 256,334" fill="url(#facetNoseBridge)"/>
    <polygon points="256,248 280,254 270,328 256,334" fill="#0284c7"/>

    <!-- SNOUT / MUZZLE SIDES -->
    <!-- Snout Left -->
    <polygon points="232,254 178,284 196,318 242,328" fill="url(#facetMuzzleLeft)"/>
    <!-- Snout Right -->
    <polygon points="280,254 334,284 316,318 270,328" fill="url(#facetMuzzleRight)"/>

    <!-- LOWER MUZZLE & LIPS -->
    <!-- Muzzle Low Left -->
    <polygon points="242,328 196,318 168,368 228,382 244,374" fill="#0a192f"/>
    <!-- Muzzle Low Right -->
    <polygon points="270,328 316,318 344,368 284,382 268,374" fill="#061222"/>

    <!-- NOSE TIP (CYAN/BLUE HIGHLIGHT) -->
    <!-- Nose Center -->
    <polygon points="256,334 242,328 244,374 256,386 268,374 270,328" fill="url(#facetSnoutCenter)"/>
    <!-- Nose Leather Tip -->
    <polygon points="256,366 248,376 256,386 264,376" fill="#083344"/>

    <!-- CHIN & JAW PEAK -->
    <polygon points="256,386 228,382 256,438" fill="url(#facetChin)"/>
    <polygon points="256,386 284,382 256,438" fill="#0284c7"/>
    <polygon points="228,382 168,368 214,416 256,438" fill="#0e2338"/>
    <polygon points="284,382 344,368 298,416 256,438" fill="#081726"/>

    <!-- ================= GLOWING NEON CYAN EYES ================= -->
    <!-- Left Eye (Slanted cyber-wolf eye) -->
    <polygon points="208,242 230,248 214,253" fill="url(#eyeGlow)" filter="url(#eyeNeon)"/>
    <polygon points="208,242 230,248 214,253" fill="#ffffff" opacity="0.9"/>

    <!-- Right Eye (Slanted cyber-wolf eye) -->
    <polygon points="304,242 282,248 298,253" fill="url(#eyeGlow)" filter="url(#eyeNeon)"/>
    <polygon points="304,242 282,248 298,253" fill="#ffffff" opacity="0.9"/>
  </g>
</svg>
